name: Build Windows Native Installers (.NET 10 + Inno Setup)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-package-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout ServerForge
        uses: actions/checkout@v4

      - name: Setup .NET 10 LTS SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore, Test & Publish Self-Contained x64 Binaries
        shell: pwsh
        run: ./ServerForge/scripts/build-windows.ps1 -Configuration Release

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build ServerForge-Desktop-Setup.exe & ServerForge-Agent-Setup.exe
        shell: pwsh
        run: ./ServerForge/scripts/build-installers.ps1

      - name: Generate Release SHA-256 Checksums
        shell: pwsh
        run: |
          Get-FileHash ./ServerForge/artifacts/installers/*.exe -Algorithm SHA256 |
            Format-Table Algorithm, Hash, Path -AutoSize |
            Out-File ./ServerForge/artifacts/installers/SHA256SUMS.txt

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: serverforge-windows-x64-installers
          path: |
            ServerForge/artifacts/installers/ServerForge-Desktop-Setup.exe
            ServerForge/artifacts/installers/ServerForge-Agent-Setup.exe
            ServerForge/artifacts/installers/SHA256SUMS.txt
          retention-days: 30
