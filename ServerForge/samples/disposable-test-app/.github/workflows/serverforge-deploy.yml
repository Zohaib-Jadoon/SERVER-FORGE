name: Build & Publish ServerForge Disposable Sample Artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Release version label embedded into release-metadata.json'
        required: false
        default: '1.0.0'

jobs:
  build-artifact:
    runs-on: windows-latest
    steps:
      - name: Checkout sample repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Self-Contained Windows x64 Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish ServerForge.SampleApp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o ./publish-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $ver = if ([string]::IsNullOrWhiteSpace('${{ inputs.app_version }}')) {
            "1.0.$env:GITHUB_RUN_NUMBER"
          } else {
            '${{ inputs.app_version }}'
          }
          $meta = [ordered]@{
            version    = $ver
            commitSha  = $env:GITHUB_SHA
            runId      = $env:GITHUB_RUN_ID
            builtAtUtc = (Get-Date).ToUniversalTime().ToString('O')
          }
          $meta | ConvertTo-Json -Depth 4 | Set-Content -Path ./publish-out/release-metadata.json -Encoding UTF8

      - name: Package Release ZIP & Verify SHA-256 Digest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path ./publish-out/* -DestinationPath ./app-release.zip -Force
          if (-not (Test-Path ./app-release.zip) -or (Get-Item ./app-release.zip).Length -le 0) {
            throw 'app-release.zip was missing or empty.'
          }
          $hash = (Get-FileHash -Path ./app-release.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  app-release.zip" | Set-Content -Path ./app-release.zip.sha256 -Encoding ASCII
          Write-Host "Verified artifact SHA-256: $hash (commit=$env:GITHUB_SHA)"

      - name: Upload Verified Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: serverforge-sample-app-win-x64
          path: |
            ./app-release.zip
            ./app-release.zip.sha256
          retention-days: 14
