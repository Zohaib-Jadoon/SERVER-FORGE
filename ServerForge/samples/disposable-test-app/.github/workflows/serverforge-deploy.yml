name: Build & Publish ServerForge Disposable Sample Artifact

# Copy this workflow into the ROOT `.github/workflows/serverforge-deploy.yml`
# of your dedicated disposable sample GitHub repository.
# GitHub Actions packages `./publish-out/**` directly as the single signed workflow artifact ZIP
# with an authoritative server-reported SHA-256 digest (`digest: sha256:...`).

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Optional release version label override (alphanumeric, dots, hyphens)'
        required: false
        default: ''

jobs:
  build-artifact:
    runs-on: windows-latest
    steps:
      - name: Checkout sample repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Self-Contained Windows x64 Release
        shell: pwsh
        env:
          INPUT_APP_VERSION: ${{ inputs.app_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish ServerForge.SampleApp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o ./publish-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $cfgVersion = ''
          $cfgUnhealthy = $false
          if (Test-Path ./release-config.json) {
            $cfg = Get-Content ./release-config.json -Raw | ConvertFrom-Json
            if ($null -ne $cfg.version) { $cfgVersion = [string]$cfg.version }
            if ($null -ne $cfg.simulateUnhealthy) { $cfgUnhealthy = [bool]$cfg.simulateUnhealthy }
          }

          $ver = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_APP_VERSION)) {
            if ($env:INPUT_APP_VERSION -notmatch '^[A-Za-z0-9._-]{1,40}$') {
              throw 'Invalid app_version input.'
            }
            $env:INPUT_APP_VERSION
          } elseif (-not [string]::IsNullOrWhiteSpace($cfgVersion)) {
            $cfgVersion
          } else {
            "1.0.$env:GITHUB_RUN_NUMBER"
          }

          $meta = [ordered]@{
            version           = $ver
            commitSha         = $env:GITHUB_SHA
            runId             = $env:GITHUB_RUN_ID
            simulateUnhealthy = $cfgUnhealthy
            builtAtUtc        = (Get-Date).ToUniversalTime().ToString('O')
          }
          $meta | ConvertTo-Json -Depth 4 | Set-Content -Path ./publish-out/release-metadata.json -Encoding UTF8

          if (-not (Test-Path ./publish-out/ServerForge.SampleApp.dll)) {
            throw 'Expected published ServerForge.SampleApp.dll was not produced.'
          }

      - name: Upload Verified Build Artifact (Flat Release Root)
        uses: actions/upload-artifact@v4
        with:
          name: serverforge-sample-app-win-x64
          path: ./publish-out/**
          if-no-files-found: error
          retention-days: 14
